name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit + integration tests (race)
        run: go test -race ./... -count=1

      - name: Overhead benchmark (Phase 6 target <10ms)
        run: go test ./internal/api/ -run '^$' -bench BenchmarkOverhead -benchtime=100000x

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build